task_type: ddi_prediction
dataset_name: TWOSIDES
data_path: data/tdc/TWOSIDES/TWOSIDES.csv
drug_a_smiles_column: drug_a_smiles
drug_b_smiles_column: drug_b_smiles
drug_a_name_column: drug_a_name
drug_b_name_column: drug_b_name
label_column: label
split_type: cold_drug
feature_set: all_features
model_type: random_forest
use_llm_rules: true
use_imagemol: true
use_smiles_encoder: true
use_visual_semantic: true
use_evidence_retrieval: true
imagemol_checkpoint_path: checkpoints/imagemol/ImageMol.pth.tar
smiles_encoder_model_name: checkpoints/chemberta2/DeepChem-ChemBERTa-77M-MTR
smiles_encoder_device: auto
smiles_pooling: cls
smiles_local_files_only: true
llm_profile: qwen_flash
use_mllm_visual_semantic: false
mllm_profile: kimi_k2_6_bailian
output_dir: outputs/tdc_ddi/TWOSIDES
random_seed: 13
tdc_task: multi_pred/DDI
tdc_label_mode: multiclass_interaction_type
positive_label: 1
positive_label_meaning: DDI risk/interaction
negative_label: 0
negative_label_meaning: no DDI risk/interaction
decision_threshold: 0.5
warning: This config points to TDC multiclass DDI labels. agentM's current DDI metrics
  are binary; enable multiclass DDI metrics or build a binary negative-sampled file
  before using this as a benchmark.
