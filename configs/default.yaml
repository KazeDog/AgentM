rag_embedding_device: auto
rag_embedding_local_files_only: true
rag_embedding_batch_size: 16
use_llm_rag: false
ddi_rag_corpus_dir: data/rag_corpus/ddi_real
ddi_rag_build_on_demand: true
ddi_rag_timeout: 12
ddi_rag_max_pubmed: 8
