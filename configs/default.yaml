llm_model: qwen3.6-flash
use_llm_planner: true
use_llm_decision_layer: true
use_mllm_visual_semantic: false
mllm_profile: kimi_k2_6_bailian
mllm_provider: bailian_kimi
mllm_model: kimi-k2.6
output_dir: outputs/default_run
random_seed: 13
smiles_column: smiles
label_column: label
