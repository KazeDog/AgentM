task_type: property_prediction
dataset_name: BBBP
data_path: data/sample_property.csv
split_type: scaffold
feature_set: all_features
model_type: random_forest
use_llm_rules: true
use_imagemol: true
use_smiles_encoder: true
use_visual_semantic: true
use_evidence_retrieval: true
use_rag_evidence: true
rag_corpus_dirs:
  - data/rag_corpus/tdc_real
rag_top_k: 5
rag_backend: dense_faiss
rag_embedding_model_name: checkpoints/rag/scibert_scivocab_uncased
